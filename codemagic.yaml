    - &Extract_FCM_Token
      name: Extract FCM Token (from logs)
      script: |
        if [ "$PUSH_NOTIFY" = "true" ]; then
          echo "📦 Adding Firebase plugin to build.gradle files..."

          # Apply Firebase plugin in app-level build.gradle if missing
          if ! grep -q "com.google.gms.google-services" android/app/build.gradle; then
            echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
            echo "✅ Firebase plugin added to app/build.gradle"
          fi

          # Add Firebase classpath in project-level build.gradle if missing
          if ! grep -q "com.google.gms:google-services" android/build.gradle; then
            sed -i '/dependencies {/a\
              classpath '\''com.google.gms:google-services:4.3.15'\''\
            ' android/build.gradle
            echo "✅ Firebase classpath added to android/build.gradle"
          fi

          echo "📥 Downloading google-services.json..."
          curl -s -o android/app/google-services.json "$firebase_config_android"

          echo "🔧 Updating minSdkVersion and targetSdkVersion..."
          sed -i 's/minSdkVersion\s*=\s*flutter.minSdkVersion/minSdkVersion 21/' android/app/build.gradle
          sed -i 's/targetSdkVersion\s*=\s*flutter.targetSdkVersion/targetSdkVersion 34/' android/app/build.gradle
          echo "✅ SDK versions updated"

          echo "🚀 Building APK to capture FCM token..."
          flutter build apk > flutter_build.log

          echo "🔍 Searching for FCM Token in build logs..."
          FCM_TOKEN=$(grep 'FCM Token:' flutter_build.log | awk -F':' '{print $2}' | xargs)

          if [ -n "$FCM_TOKEN" ]; then
            echo "✅ FCM Token Found: $FCM_TOKEN"
            echo "📩 FCM Token: $FCM_TOKEN" > fcm_token.txt

            echo "📧 Sending FCM token to $EMAIL_ID"
            curl -s --url 'smtps://smtp.gmail.com:465' --ssl-reqd \
              --mail-from "$EMAIL_ID" \
              --mail-rcpt "$EMAIL_ID" \
              --upload-file fcm_token.txt \
              --user "$EMAIL_ID:$EMAIL_PASSWORD" \
              --insecure

            echo "✅ Email sent successfully!"
          else
            echo "⚠️ FCM Token not found in build logs!"
          fi
        else
          echo "🚫 Firebase config skipped (PUSH_NOTIFY is not true)"
        fi


