      - *set_launcher_icons
      - *get_splash
      - *set_splash_icons
      - *change_app_name
      - *Extract_FCM_Token
      - *build_release_apk
#     - *build_abb
#     - *build_debug_apk
    artifacts:
      - *android_apk
    #        - *android_abb
    publishing: *email_release
